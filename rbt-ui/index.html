<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RaasBridgeToken (RBT) Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
:root {
  --gold: #FFD700;
  --black: #000000;
  --white: #FFFFFF;
}
body { font-family: Arial, sans-serif; margin: 20px; background: var(--black); color: var(--white); }
h2 { color: var(--gold); }
input, select { padding: 8px; margin: 5px; width: 300px; border-radius: 5px; border: 1px solid var(--gold); background: var(--white); color: var(--black); font-weight: bold; }
button { cursor: pointer; font-weight: bold; border-radius: 5px; border: 2px solid var(--gold); background: var(--white); color: var(--black); transition: all 0.3s ease; padding: 10px 15px; }
button:hover { background: var(--gold); color: var(--black); transform: translateY(-2px); }
.warning { color: red; font-weight: bold; }
.status { font-weight: bold; }
table { border-collapse: collapse; width: 100%; margin-top: 15px; background: var(--black); color: var(--white); }
th, td { border: 1px solid var(--gold); padding: 8px; text-align: center; }
th { background-color: var(--gold); color: var(--black); font-weight: bold; }
#txHistory tbody tr:nth-child(odd) { background-color: var(--black); color: var(--white); }
#txHistory tbody tr:nth-child(even) { background-color: var(--gold); color: var(--black); }
#txHistory tbody tr:hover { background-color: #ffeb7f; color: var(--black); }
.disabled { opacity: 0.5; pointer-events: none; }
a.portal-link { color: var(--gold); font-weight: bold; text-decoration: none; }
a.portal-link:hover { text-decoration: underline; }
#loadMore { margin-top: 15px; background: var(--white); color: var(--black); width: 200px; }
</style>
</head>
<body>

<h2>RaasBridgeToken (RBT) Dashboard</h2>

<div>
  <button id="connectWalletBtn">Connect Wallet</button><br><br>
  <strong>Wallet Address:</strong> <span id="walletAddress">Not Connected</span>
  <span id="walletStatus" class="status" style="color:red;">● Disconnected</span><br>
  <strong>Network:</strong> <span id="networkStatus" class="status">Not Connected</span><br>
  <strong>Balance:</strong> <span id="balance">0</span> RBT<br>
  <strong>Token Info:</strong> <span id="tokenInfo"></span><br>
  <span id="gasWarning" class="warning"></span><br>
  <span id="networkWarning" class="warning"></span><br>
  <a href="https://raasystem.net/raasbridge-ui" target="_blank" class="portal-link">Open RaasBridge Dashboard</a>
</div>

<hr style="border-color: var(--gold);">

<h3>Transfer RBT</h3>
<input type="text" id="recipient" placeholder="Recipient Address">
<input type="text" id="amount" placeholder="Amount RBT">
<button id="transferBtn">Send RBT</button>

<hr style="border-color: var(--gold);">

<h3>Mint RBT (Owner Only)</h3>
<input type="text" id="mintRecipient" placeholder="Recipient Address">
<input type="text" id="mintAmount" placeholder="Amount RBT">
<button id="mintBtn">Mint RBT</button>
<span id="mintWarning" class="warning"></span>

<hr style="border-color: var(--gold);">

<h3>Transaction History & Events</h3>
<table id="txHistory">
  <thead>
    <tr>
      <th>Type</th>
      <th>From</th>
      <th>To</th>
      <th>Amount</th>
      <th>Tx Hash</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<button id="loadMore">Load Older Transactions</button>

<script src="Dashboard.js"></script>
</body>
</html>
